# Pipeline de CI para o Vitalitas Backend (.NET 9 / EF Core / Azure SQL).
# Build + testes unitários (se existirem). Aplicar migrations no Azure SQL
# fica como passo manual/opcional documentado no final deste arquivo — ver
# ADR-0010 (docs/adr/0010-adocao-ef-core-azure-sql.md) sobre por que a
# aplicação automática de migrations no pipeline não está habilitada por padrão.

trigger:
  branches:
    include:
      - prd
      - des
      - feat/*

pr:
  branches:
    include:
      - prd
      - des

pool:
  vmImage: "ubuntu-latest"

variables:
  buildConfiguration: "Release"
  solution: "Vitalitas.sln"
  dotnetSdkVersion: "9.0.x"

stages:
  - stage: Build
    displayName: "Build e Testes"
    jobs:
      - job: BuildAndTest
        displayName: "dotnet build + dotnet test"
        steps:
          - task: UseDotNet@2
            displayName: "Instalar .NET SDK $(dotnetSdkVersion)"
            inputs:
              packageType: "sdk"
              version: "$(dotnetSdkVersion)"

          - task: DotNetCoreCLI@2
            displayName: "dotnet restore"
            inputs:
              command: "restore"
              projects: "$(solution)"

          - task: DotNetCoreCLI@2
            displayName: "dotnet build"
            inputs:
              command: "build"
              projects: "$(solution)"
              arguments: "--configuration $(buildConfiguration) --no-restore"

          # Roda os testes unitários apenas se existir algum projeto de teste no
          # repositório (ainda não existe nenhum — ver README, seção de testes).
          - bash: |
              set -e
              if find . -iregex '.*\(Tests\|Test\)\.csproj$' -not -path '*/bin/*' -not -path '*/obj/*' | grep -q .; then
                echo "##[section]Projetos de teste encontrados, executando dotnet test..."
                dotnet test "$(solution)" --configuration $(buildConfiguration) --no-build --logger trx --results-directory "$(Agent.TempDirectory)/TestResults"
              else
                echo "##[warning]Nenhum projeto de teste (*Tests.csproj) encontrado no repositório. Etapa de testes pulada."
              fi
            displayName: "dotnet test (se houver projetos de teste)"

          - task: PublishTestResults@2
            displayName: "Publicar resultados de teste"
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: "VSTest"
              testResultsFiles: "$(Agent.TempDirectory)/TestResults/*.trx"
              failTaskOnFailedTests: true
            continueOnError: true

